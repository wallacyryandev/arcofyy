<div id="dv"><div><h2>Conectar aparelhos</h2><span class="st" id="stt">Desconectado</span><p>Abra o Arcofy nos dois aparelhos. Em um, toque em Gerar código. No outro, digite os 8 números e toque em Conectar. Depois disso as músicas e o tempo de escuta ficam iguais nos dois, e cada música nova é enviada sozinha.</p>

A.ontimeupdate=()=>{const n=A.currentTime;if(!A.paused&&T[cur]&&n>lt&&n-lt<1.5)ls(T[cur].k,n-lt);lt=n;const p=A.duration?A.currentTime/A.duration*100:0;$('#c').textContent=tm(A.currentTime);$('#d').textContent=tm(A.duration);$('#sk').value=p;$('#sk').style.setProperty('--p',p+'%');$('#pl').style.setProperty('--pp',p+'%')};
$('#sk').oninput=e=>{if(A.duration)A.currentTime=e.target.value/100*A.duration};
$('#vl').oninput=e=>{A.volume=+e.target.value;e.target.style.setProperty('--p',e.target.value*100+'%')};
/* telas */
const row=(t,i,n)=>`<button class="rw ${i==cur?'on':''}" onclick="play(${i})"><div class="nn"><span>${i==cur&&!A.paused?'♪':n}</span>${IC.p}</div><div class="tt">${cv(t)}<div><b class="tt">${E(t.title)}</b><small>${E(t.artist)}</small></div></div><small>${E(t.album)}</small></button>`;
const list=a=>`<div class="hd"><span>#</span><span>Título</span><span>Álbum</span></div>`+a.map((t,n)=>row(t,T.indexOf(t),n+1)).join('');
const grp=k=>{const m={};T.forEach((t,i)=>(m[t[k]]=m[t[k]]||[]).push(i));return Object.entries(m)};
const card=(g,k)=>`<button class="cd ${k=='artist'?'ar':''}" onclick="play(${g[1][0]})">${cv(T[g[1][0]])}<b>${E(g[0])}</b><small>${k=='artist'?'Artista':E(T[g[1][0]].artist)}</small></button>`;
/* estatísticas: segundos realmente ouvidos por aparelho|dia|música; mescla pelo MÁXIMO de cada célula */
const day=()=>new Date().toISOString().slice(0,10);
function ls(k,x){const c=ME+'|'+day()+'|'+k;ST[c]=(ST[c]||0)+x;if(!sd){sd=1;setTimeout(()=>{sd=0;S('m','readwrite',s=>s.put(ST,'stats'));if(ch&&ch.readyState=='open')ch.send(JSON.stringify({t:'s',c:ST}))},5000)}}
const sum=f=>{let t=0;for(const c in ST)if(f(c.split('|')[1]))t+=ST[c];return t};
const tg=(k,v)=>`<button class="tg ${v?'on':''}" onclick="tgl('${k}')"></button>`,sr=(a,b,c)=>`<div class="cr"><div><b>${a}</b><small style="color:var(--t2)">${b}</small></div>${c}</div>`;
const tgl=k=>{if(k=='auto'){AU=!AU;try{localStorage.auto=AU?1:0}catch(e){}}else if(k=='sh')sh=!sh;else rp=!rp;bar();R()};
function cfg(){const td=day(),mo=td.slice(0,7),top={};for(const c in ST){const k=c.split('|')[2];top[k]=(top[k]||0)+ST[c]}
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),mi=s=>Math.floor(s/60)+' min',bx=(a,b)=>`<div class="cd"><small>${a}</small><b style="font-size:24px">${b}</b></div>`;
return `<div class="pd"><h1>Configurações</h1><h2>Estatísticas de escuta</h2><div class="qk" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${bx('Hoje',mi(sum(d=>d==td)))}${bx('Este mês',mi(sum(d=>d.startsWith(mo))))}${bx('Total',mi(sum(()=>1)))}</div>
${tp.length?'<h2>Mais ouvidas</h2>'+tp.map(([k,s])=>{const t=T.find(x=>x.k==k);return t?`<div class="cr"><div style="display:flex;gap:12px;align-items:center;min-width:0">${cv(t)}<div style="min-width:0"><b>${E(t.title)}</b><small style="color:var(--t2)">${E(t.artist)}</small></div></div><span style="color:var(--t2)">${mi(s)}</span></div>`:''}).join(''):''}
<h2>Biblioteca</h2>${sr('Pasta de músicas','Escolha uma vez; o Arcofy acha as novas sozinho','<button class="bt o" onclick="pick()">Escolher</button><label class="bt o" for="fi" style="cursor:pointer;margin-left:6px">Arquivos</label>')}${sr('Buscar músicas novas agora',T.length+' músicas neste aparelho','<button class="bt o" onclick="chk().then(()=>toast(\'Busca concluída\'))">Buscar</button>')}${sr('Busca automática','Procura músicas novas a cada minuto',tg('auto',AU))}
<h2>Reprodução</h2>${sr('Aleatório','Toca as músicas em ordem aleatória',tg('sh',sh))}${sr('Repetir','Repete a música atual',tg('rp',rp))}
<h2>Aparelhos</h2>${sr('Conectar aparelho','Sincroniza músicas e tempo de escuta','<button class="bt o dvb">Conectar</button>')}
<h2>Sobre</h2>${sr('Arcofy','Versão 1.0','')}</div>`}
function R(){
$$('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
$('#ll').innerHTML=T.map((t,i)=>`<button class="li ${i==cur?'on':''}" onclick="play(${i})">${cv(t)}<div style="min-width:0"><b>${E(t.title)}</b><small>${E(t.artist)}</small></div></button>`).join('');
let h='';
if(!T.length&&view!='cfg')h=`<div class="em"><h2>Suas músicas aparecem aqui</h2><p>Escolha a pasta de músicas do aparelho uma única vez. Daqui em diante o Arcofy encontra as músicas novas sozinho.</p><button class="bt" onclick="pick()">Escolher pasta de músicas</button><label class="bt o" for="fi" style="cursor:pointer">Adicionar arquivos</label><button class="bt o dvb">Conectar outro aparelho</button></div>`;
else if(view=='home'){const hr=new Date().getHours();h=`<div class="pd"><h1>${hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite'}</h1><div class="qk">${T.slice(0,8).map((t,i)=>`<button onclick="play(${i})">${cv(t)}${E(t.title)}</button>`).join('')}</div>
<h2>Álbuns</h2><div class="sh">${grp('album').map(g=>card(g,'album')).join('')}</div><h2>Artistas</h2><div class="sh">${grp('artist').map(g=>card(g,'artist')).join('')}</div><h2>Todas as músicas</h2>${list(T)}</div>`}
else if(view=='search')h=`<div class="pd"><div class="sr"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7 14 5 12 5 9.5S7 5 9.5 5 14 7 14 9.5 12 14 9.5 14z"/></svg><input id="q" placeholder="O que você quer ouvir?" value="${E(Q)}" oninput="Q=this.value;res()"></div><div id="rs"></div></div>`;
else if(view=='cfg')h=cfg();else h=`<div class="pd"><h1>Sua Biblioteca</h1>${list(T)}</div>`;
$('#vw').innerHTML=h;if(view=='search')res();bindD()}
function res(){const q=Q.toLowerCase(),a=T.filter(t=>(t.title+t.artist+t.album).toLowerCase().includes(q));$('#rs').innerHTML=q?(a.length?'<h2>Músicas</h2>'+list(a):'<div class="em">Nenhum resultado para “'+E(Q)+'”</div>'):list(T)}
$$('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;$('#mn').scrollTop=0;R()});
/* sincronização entre aparelhos (WebRTC direto, sem servidor) */
const en=d=>btoa(unescape(encodeURIComponent(JSON.stringify(d)))),de=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
const st=(m)=>{$('#stt').textContent=m;$('#stt').classList.toggle('ok',m=='Conectado')};
const gath=()=>new Promise(r=>{if(P.iceGatheringState=='complete')r();else{P.onicegatheringstatechange=()=>P.iceGatheringState=='complete'&&r();setTimeout(r,4000)}});
function mk(){P=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});P.ondatachannel=e=>setCh(e.channel);P.onconnectionstatechange=()=>{if(P.connectionState=='failed'||P.connectionState=='disconnected')st('Desconectado')}}
$('#go').onclick=async()=>{mk();setCh(P.createDataChannel('m'));await P.setLocalDescription(await P.createOffer());st('Gerando…');await gath();$('#code').value=en(P.localDescription);st('Aguardando o outro aparelho')};
$('#ok').onclick=async()=>{try{const d=de($('#cin').value);if(d.type=='offer'){mk();await P.setRemoteDescription(d);await P.setLocalDescription(await P.createAnswer());await gath();$('#code').value=en(P.localDescription);st('Devolva o código ao outro aparelho')}else await P.setRemoteDescription(d)}catch(e){toast('Código inválido')}};

function setCh(c){ch=c;c.binaryType='arraybuffer';c.onopen=()=>{st('Conectado');toast('Aparelho conectado');man(1);c.send(JSON.stringify({t:'s',c:ST}))};c.onclose=()=>st('Desconectado');c.onmessage=onMsg}
const man=r=>{if(ch&&ch.readyState=='open')ch.send(JSON.stringify({t:'m',i:T.map(x=>x.k),r}))};
async function onMsg(e){const d=e.data;
if(typeof d!='string'){const v=new DataView(d),r=RX[v.getUint32(0)];if(r){r.p.push(d.slice(4));r.g+=d.byteLength-4;toast('Recebendo “'+r.n.replace(/\.[^.]+$/,'')+'” — '+Math.round(r.g/r.s*100)+'%')}return}
const m=JSON.parse(d);
if(m.t=='m'){if(m.r)man(0);const out=T.filter(x=>!m.i.includes(x.k));if(out.length)QQ=QQ.then(()=>send(out)).catch(()=>{})}
else if(m.t=='s'){for(const c in m.c)ST[c]=Math.max(ST[c]||0,m.c[c]);if(view=='cfg')R()}
else if(m.t=='f')RX[m.id]={n:m.n,s:m.s,p:[],g:0};
else if(m.t=='e'){const r=RX[m.id];delete RX[m.id];if(r&&r.g==r.s&&await addF([new File(r.p,r.n,{type:'audio/mpeg'})]))toast('Recebida: '+r.n.replace(/\.[^.]+$/,''))}}
async function send(l){for(const x of l){const id=(Math.random()*4e9)>>>0;ch.send(JSON.stringify({t:'f',id,n:x.name,s:x.size}));
for(let o=0;o<x.size;o+=16000){while(ch.bufferedAmount>5e5)await new Promise(r=>setTimeout(r,20));const a=await x.blob.slice(o,o+16000).arrayBuffer(),b=new Uint8Array(4+a.byteLength);new DataView(b.buffer).setUint32(0,id);b.set(new Uint8Array(a),4);ch.send(b)}
ch.send(JSON.stringify({t:'e',id}))}}
function bindD(){$$('.dvb').forEach(b=>b.onclick=()=>$('#dv').classList.add('on'))}
$('#x').onclick=()=>$('#dv').classList.remove('on');
/* pareamento por código de 8 números (broker público PeerJS) */
let PR=null;
function wrap(c){const a={get readyState(){return c.open?'open':'closed'},get bufferedAmount(){return c.dataChannel?c.dataChannel.bufferedAmount:0},send:d=>c.send(d)};c.on('open',()=>a.onopen&&a.onopen());c.on('close',()=>a.onclose&&a.onclose());c.on('data',d=>a.onmessage&&a.onmessage({data:d}));if(c.open)setTimeout(()=>a.onopen&&a.onopen());return a}
function peer(id){return new Promise((ok,no)=>{if(typeof Peer=='undefined'){st('Sem acesso ao serviço de pareamento');return no('x')}if(PR)PR.destroy();PR=new Peer(...(id?[id]:[]),{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});PR.on('open',()=>ok(PR));PR.on('error',e=>{st(e.type=='peer-unavailable'?'Código não encontrado':'Erro: '+e.type);no(e)});PR.on('connection',c=>setCh(wrap(c)))})}
$('#go').onclick=async()=>{const n=String(Math.floor(Math.random()*1e8)).padStart(8,'0');st('Criando código…');try{await peer('arcofy-'+n);$('#code').textContent=n.replace(/(\d{4})(\d{4})/,'$1 $2');st('Aguardando o outro aparelho')}catch(e){}};
$('#ok').onclick=async()=>{const n=$('#cin').value.replace(/\D/g,'');if(n.length!=8)return toast('Digite os 8 números');st('Conectando…');try{const p=await peer(null),c=p.connect('arcofy-'+n,{serialization:'raw',reliable:true});setCh(wrap(c));setTimeout(()=>{if(!c.open)st('Não consegui conectar')},12000)}catch(e){}};
/* início */
(async()=>{T=await S('t','readonly',s=>s.getAll())||[];ST=await S('m','readonly',s=>s.get('stats'))||{};T.forEach(url);R();bar();DH=await S('m','readonly',s=>s.get('dir'));chk()})();
</script></body></html>
